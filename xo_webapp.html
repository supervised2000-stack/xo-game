<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XO ARENA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

:root {
  --bg: #07070f;
  --surface: #0f0f1c;
  --card: #14142a;
  --border: #22224a;
  --x: #e63757;
  --o: #00c2e0;
  --gold: #f5c542;
  --text: #e4e4ff;
  --muted: #5555a0;
  --radius: 18px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family:'Tajawal',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; overflow-x:hidden;
}

/* ── خلفية ── */
.bg-layer {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 20% 10%, rgba(230,55,87,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 80% 90%, rgba(0,194,224,0.07) 0%, transparent 60%);
}
.grid-layer {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size:48px 48px;
}

.wrap { position:relative; z-index:1; width:100%; max-width:430px; padding:14px; }

/* ── شاشات ── */
.screen { display:none; flex-direction:column; align-items:center; gap:14px; }
.screen.active { display:flex; }

/* ── لوغو ── */
.logo { text-align:center; padding:20px 0 4px; }
.logo-title {
  font-size:52px; font-weight:900; letter-spacing:8px; line-height:1;
  background:linear-gradient(120deg,var(--x),#ff8c00,var(--o));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.logo-sub { font-size:11px; color:var(--muted); letter-spacing:5px; margin-top:6px; text-transform:uppercase; }

/* ── بطاقة ── */
.card {
  width:100%; background:var(--card);
  border:1px solid var(--border); border-radius:var(--radius); padding:18px;
}
.card-title {
  font-size:11px; color:var(--muted); letter-spacing:3px;
  text-transform:uppercase; text-align:center; margin-bottom:14px;
}

/* ── لاعب مختار ── */
.player-display {
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border-radius:14px; padding:12px 16px;
  border:1.5px solid var(--border); margin-bottom:10px;
}
.player-display.x-side { border-color:rgba(230,55,87,0.4); }
.player-display.o-side { border-color:rgba(0,194,224,0.4); }
.pd-sym { width:34px; height:34px; flex-shrink:0; }
.pd-info { flex:1; }
.pd-label { font-size:10px; color:var(--muted); }
.pd-name { font-size:15px; font-weight:700; }
.pd-name.x { color:var(--x); }
.pd-name.o { color:var(--o); }

/* ── قائمة الأعضاء ── */
.members-list {
  display:flex; flex-direction:column; gap:8px;
  max-height:280px; overflow-y:auto;
}
.members-list::-webkit-scrollbar { width:3px; }
.members-list::-webkit-scrollbar-track { background:transparent; }
.members-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.member-item {
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border-radius:12px; padding:11px 14px;
  border:1.5px solid var(--border); cursor:pointer;
  transition:border-color 0.2s, background 0.2s;
}
.member-item:active { transform:scale(0.98); }
.member-item.selected {
  border-color:var(--o); background:rgba(0,194,224,0.08);
}
.member-item.is-me { opacity:0.4; cursor:default; pointer-events:none; }

.member-avatar {
  width:38px; height:38px; border-radius:50%;
  background:linear-gradient(135deg,var(--border),var(--surface));
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:900; color:var(--text); flex-shrink:0;
  border:1.5px solid var(--border);
}
.member-info { flex:1; min-width:0; }
.member-name { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.member-user { font-size:11px; color:var(--muted); }
.member-check {
  width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s;
}
.member-item.selected .member-check {
  background:var(--o); border-color:var(--o);
}

/* ── زر رئيسي ── */
.btn-primary {
  width:100%; padding:17px; border:none; border-radius:16px;
  font-family:'Tajawal',sans-serif; font-size:17px; font-weight:900;
  cursor:pointer; letter-spacing:1px; position:relative; overflow:hidden;
  background:linear-gradient(135deg,var(--x),#c0392b);
  color:#fff; transition:transform 0.15s;
  box-shadow:0 4px 24px rgba(230,55,87,0.35);
}
.btn-primary:active { transform:scale(0.97); }
.btn-primary:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

/* ── لوحة اللعب ── */
.scoreboard {
  width:100%; display:flex; align-items:stretch; gap:10px;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 12px;
}
.sb-side { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
.sb-sym { width:28px; height:28px; }
.sb-name { font-size:12px; font-weight:700; color:var(--muted); text-align:center; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sb-score { font-size:40px; font-weight:900; line-height:1; }
.sb-score.x { color:var(--x); }
.sb-score.o { color:var(--o); }
.sb-mid { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.sb-colon { font-size:24px; color:var(--border); font-weight:900; }
.sb-round { font-size:10px; color:var(--muted); background:var(--surface); padding:3px 10px; border-radius:20px; border:1px solid var(--border); letter-spacing:1px; }

/* ── مؤشر الدور ── */
.turn-bar {
  width:100%; padding:11px 16px; border-radius:14px; text-align:center;
  font-size:14px; font-weight:700; transition:all 0.3s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.turn-bar.x-turn { background:rgba(230,55,87,0.1); border:1.5px solid rgba(230,55,87,0.35); color:var(--x); }
.turn-bar.o-turn { background:rgba(0,194,224,0.1); border:1.5px solid rgba(0,194,224,0.35); color:var(--o); }
.turn-icon { width:18px; height:18px; }

/* ── اللوحة ── */
.board {
  width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap:9px;
}
.cell {
  aspect-ratio:1; background:var(--card); border:1.5px solid var(--border);
  border-radius:16px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background 0.15s, border-color 0.15s, transform 0.1s;
  position:relative; overflow:hidden;
}
.cell:active:not(.taken) { transform:scale(0.92); background:rgba(255,255,255,0.05); }
.cell.x-cell { border-color:rgba(230,55,87,0.5); background:rgba(230,55,87,0.07); }
.cell.o-cell { border-color:rgba(0,194,224,0.5); background:rgba(0,194,224,0.07); }
.cell.taken { cursor:default; }
.cell.win-cell { animation:winFlash 0.4s ease forwards; }
@keyframes winFlash { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1.05)} }
.cell-mark {
  width:54%; height:54%; animation:popIn 0.22s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes popIn {
  from{transform:scale(0) rotate(-15deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}
}

/* ── أزرار السفلية ── */
.row-btns { width:100%; display:flex; gap:9px; }
.btn-sec {
  flex:1; padding:13px; border-radius:13px;
  background:var(--card); border:1.5px solid var(--border);
  color:var(--muted); font-family:'Tajawal',sans-serif;
  font-size:13px; font-weight:700; cursor:pointer; transition:all 0.15s;
}
.btn-sec:active { transform:scale(0.96); }
.btn-danger { border-color:rgba(230,55,87,0.3); color:rgba(230,55,87,0.65); }

/* ── نتيجة ── */
.result-card {
  width:100%; background:var(--card); border:1px solid var(--border);
  border-radius:24px; padding:30px 20px;
  display:flex; flex-direction:column; align-items:center; gap:16px;
  text-align:center;
}
.res-icon { width:80px; height:80px; animation:bounceIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes bounceIn { from{transform:scale(0) rotate(-10deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
.res-title { font-size:26px; font-weight:900; letter-spacing:2px; }
.res-title.x-win { color:var(--x); }
.res-title.o-win { color:var(--o); }
.res-title.draw { color:var(--gold); }
.res-name { font-size:18px; font-weight:700; }
.res-scores {
  display:flex; align-items:center; gap:20px;
  background:var(--surface); border-radius:14px; padding:14px 28px;
  border:1px solid var(--border);
}
.rs-val { font-size:34px; font-weight:900; }
.rs-val.x { color:var(--x); }
.rs-val.o { color:var(--o); }
.rs-sep { font-size:20px; color:var(--border); }
.rs-labels { display:flex; justify-content:space-between; width:100%; font-size:10px; color:var(--muted); }

.btn-rematch {
  width:100%; padding:17px; border:none; border-radius:16px;
  font-family:'Tajawal',sans-serif; font-size:17px; font-weight:900;
  cursor:pointer; background:linear-gradient(135deg,var(--o),#0070c0);
  color:var(--bg); box-shadow:0 4px 20px rgba(0,194,224,0.3);
  transition:transform 0.15s;
}
.btn-rematch:active { transform:scale(0.97); }
.btn-ghost {
  width:100%; padding:13px; border-radius:13px;
  background:transparent; border:1.5px solid var(--border);
  color:var(--muted); font-family:'Tajawal',sans-serif;
  font-size:14px; font-weight:700; cursor:pointer; transition:all 0.15s;
}
.btn-ghost:active { background:var(--surface); }

/* ── شاشة الخطأ ── */
.error-screen { text-align:center; padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:16px; }
.error-icon { font-size:60px; }
.error-title { font-size:22px; font-weight:900; color:var(--x); }
.error-msg { font-size:14px; color:var(--muted); line-height:1.7; }

/* ── كونفيتي ── */
.confetti-wrap { position:fixed; inset:0; pointer-events:none; z-index:999; overflow:hidden; }
.cp { position:absolute; border-radius:2px; animation:fall linear forwards; }
@keyframes fall {
  0%{transform:translateY(-10px) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* ── شاشة تحميل ── */
.loading {
  position:fixed; inset:0; background:var(--bg); z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
}
.spinner {
  width:40px; height:40px; border-radius:50%;
  border:3px solid var(--border); border-top-color:var(--x);
  animation:spin 0.7s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }
.loading-txt { font-size:13px; color:var(--muted); }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="grid-layer"></div>
<div class="confetti-wrap" id="confettiWrap"></div>

<!-- تحميل -->
<div class="loading" id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-txt">جاري التحقق...</div>
</div>

<div class="wrap">

  <!-- شاشة الخطأ -->
  <div class="screen" id="screenError">
    <div class="error-screen">
      <div class="error-icon">🔒</div>
      <div class="error-title">غير مصرح</div>
      <div class="error-msg" id="errorMsg">هذه اللعبة للأعضاء فقط.<br>انضم للمجموعة أولاً.</div>
    </div>
  </div>

  <!-- شاشة اللعب -->
  <div class="screen" id="screenGame">

    <div class="scoreboard">
      <div class="sb-side">
        <svg class="sb-sym" viewBox="0 0 100 100" fill="none">
          <line x1="15" y1="15" x2="85" y2="85" stroke="#e63757" stroke-width="18" stroke-linecap="round"/>
          <line x1="85" y1="15" x2="15" y2="85" stroke="#e63757" stroke-width="18" stroke-linecap="round"/>
        </svg>
        <div class="sb-name" id="sbP1">-</div>
        <div class="sb-score x" id="sbS1">0</div>
      </div>
      <div class="sb-mid">
        <div class="sb-colon">:</div>
        <div class="sb-round" id="sbRound">١</div>
      </div>
      <div class="sb-side">
        <svg class="sb-sym" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="35" stroke="#00c2e0" stroke-width="18"/>
        </svg>
        <div class="sb-name" id="sbP2">-</div>
        <div class="sb-score o" id="sbS2">0</div>
      </div>
    </div>

    <div class="turn-bar x-turn" id="turnBar">
      <svg class="turn-icon" viewBox="0 0 100 100" fill="none" id="turnIcon">
        <line x1="15" y1="15" x2="85" y2="85" stroke="#e63757" stroke-width="18" stroke-linecap="round"/>
        <line x1="85" y1="15" x2="15" y2="85" stroke="#e63757" stroke-width="18" stroke-linecap="round"/>
      </svg>
      <span id="turnTxt">دور اللاعب الأول</span>
    </div>

    <div class="board" id="board"></div>

    <div class="row-btns">
      <button class="btn-sec" onclick="showScore()">📊 النتيجة</button>
      <button class="btn-sec btn-danger" onclick="resign()">🏳 استسلام</button>
    </div>
  </div>

  <!-- شاشة النتيجة -->
  <div class="screen" id="screenResult">
    <div class="result-card">
      <svg class="res-icon" id="resIcon" viewBox="0 0 100 100" fill="none"></svg>
      <div class="res-title" id="resTitle">فاز!</div>
      <div class="res-name" id="resName"></div>
      <div>
        <div class="res-scores">
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:4px" id="rsN1">-</div>
            <div class="rs-val x" id="rsS1">0</div>
          </div>
          <div class="rs-sep">—</div>
          <div>
            <div style="font-size:10px;color:var(--muted);margin-bottom:4px" id="rsN2">-</div>
            <div class="rs-val o" id="rsS2">0</div>
          </div>
        </div>
      </div>
      <button class="btn-rematch" onclick="rematch()">🔄 إعادة</button>
      <button class="btn-ghost" onclick="closeApp()">🏠 إغلاق</button>
    </div>
  </div>

</div>

<script type="module">
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Firebase (Firestore) — مزامنة حية بين الجهازين
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, updateDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKiVTwqIFJiRhweKah6Bcq04OQMqzjYg8",
  authDomain: "baqala-d8bed.firebaseapp.com",
  projectId: "baqala-d8bed",
  storageBucket: "baqala-d8bed.firebasestorage.app",
  messagingSenderId: "91416891455",
  appId: "1:91416891455:web:97d21d45dc21e8b8e7288a"
};
const fbApp = initializeApp(firebaseConfig);
const db    = getFirestore(fbApp);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SVG رموز
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const SVG_X = `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <line x1="15" y1="15" x2="85" y2="85" stroke="#e63757" stroke-width="16" stroke-linecap="round"/>
  <line x1="85" y1="15" x2="15" y2="85" stroke="#e63757" stroke-width="16" stroke-linecap="round"/>
</svg>`;

const SVG_O = `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="33" stroke="#00c2e0" stroke-width="16"/>
</svg>`;

const SVG_DRAW = `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M20 50 h60" stroke="#f5c542" stroke-width="10" stroke-linecap="round"/>
  <path d="M20 30 h60" stroke="#f5c542" stroke-width="10" stroke-linecap="round"/>
  <path d="M20 70 h60" stroke="#f5c542" stroke-width="10" stroke-linecap="round"/>
</svg>`;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// تيليغرام
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const ME = tg?.initDataUnsafe?.user || null;

const params   = new URLSearchParams(location.search);
const MATCH_ID = params.get('match') || tg?.initDataUnsafe?.start_param || '';

const EMPTY_CELL = '', X = 'x', O = 'o';
const WIN_COMBOS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let matchRef  = null;
let matchData = null;   // آخر نسخة من بيانات المباراة (من Firestore)
let mySymbol  = null;   // 'x' أو 'o' — يُحسب من جديد كل مرة (يتغيّر مع كل إعادة)

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// شاشات
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function hideLoading() {
  document.getElementById('loadingScreen').style.display = 'none';
}
function showError(msg) {
  document.getElementById('errorMsg').innerHTML = msg;
  hideLoading();
  show('screenError');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// تهيئة — التحقق من الهوية وربط المباراة
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function init() {
  if (!tg || !ME) {
    showError('افتح اللعبة من داخل تيليجرام فقط 🔒');
    return;
  }
  if (!MATCH_ID) {
    showError('رابط اللعبة غير صالح.<br>ابدأ تحدياً جديداً بكتابة XO في المجموعة 🎮');
    return;
  }

  matchRef = doc(db, 'xo_matches', MATCH_ID);

  let snap;
  try {
    snap = await getDoc(matchRef);
  } catch (e) {
    showError('تعذر الاتصال بالخادم 📡<br>تحقق من الإنترنت وحاول مرة أخرى');
    return;
  }

  if (!snap.exists()) {
    showError('هذه المباراة غير موجودة أو انتهت ⌛');
    return;
  }

  const data = snap.data();
  if (ME.id !== data.x_id && ME.id !== data.o_id) {
    showError('🔒 غير مصرح<br>هذه المباراة ليست لك');
    return;
  }

  hideLoading();
  renderFromMatch(data);

  onSnapshot(matchRef, (s) => {
    if (!s.exists()) { showError('تم إنهاء هذه المباراة ⌛'); return; }
    renderFromMatch(s.data());
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// الرسم من بيانات المباراة (المصدر الوحيد للحقيقة)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderFromMatch(d) {
  const cameFromActive = matchData ? matchData.active : true;
  matchData = d;
  mySymbol  = (ME.id === d.x_id) ? X : (ME.id === d.o_id ? O : null);

  updateScoreUI();
  updateTurnUI();
  buildBoard();

  if (d.active) {
    show('screenGame');
  } else if (cameFromActive) {
    if (d.last_winner) {
      const combo = checkWinBoard(d.board);
      if (combo) highlightWin(combo);
    }
    setTimeout(showResultScreen, d.last_winner ? 450 : 250);
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// بناء اللوحة
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const myTurn = matchData.active && matchData.turn === mySymbol;
  matchData.board.forEach((val, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (val ? ' taken ' + val + '-cell' : '');
    if (myTurn && !val) cell.onclick = () => clickCell(i);
    if (val) {
      const mark = document.createElement('div');
      mark.className = 'cell-mark';
      mark.innerHTML = val === X ? SVG_X : SVG_O;
      cell.appendChild(mark);
    }
    board.appendChild(cell);
  });
}

async function clickCell(i) {
  if (!matchData.active || matchData.turn !== mySymbol || matchData.board[i] || !mySymbol) return;

  const newBoard = [...matchData.board];
  newBoard[i] = mySymbol;

  const payload = { board: newBoard };
  const win = checkWinBoard(newBoard);

  if (win) {
    payload.active = false;
    payload.last_winner = mySymbol;
    payload[mySymbol === X ? 'scores_x' : 'scores_o'] =
      (mySymbol === X ? matchData.scores_x : matchData.scores_o) + 1;
  } else if (newBoard.every(v => v)) {
    payload.active = false;
    payload.last_winner = '';
  } else {
    payload.turn = mySymbol === X ? O : X;
  }

  try { await updateDoc(matchRef, payload); }
  catch (e) { if (tg) tg.showAlert('تعذر إرسال حركتك، حاول مرة أخرى'); }
}

function checkWinBoard(b) {
  for (const [a,c,d] of WIN_COMBOS) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return [a,c,d];
  }
  return null;
}

function highlightWin(combo) {
  const cells = document.getElementById('board').children;
  combo.forEach(i => cells[i] && cells[i].classList.add('win-cell'));
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// UI Updates
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function updateScoreUI() {
  document.getElementById('sbP1').textContent = matchData.x_name;
  document.getElementById('sbP2').textContent = matchData.o_name;
  document.getElementById('sbS1').textContent = matchData.scores_x;
  document.getElementById('sbS2').textContent = matchData.scores_o;
  document.getElementById('sbRound').textContent = toArabicNum(matchData.round);
}

function updateTurnUI() {
  const bar  = document.getElementById('turnBar');
  const txt  = document.getElementById('turnTxt');
  const icon = document.getElementById('turnIcon');
  const turn = matchData.turn;
  bar.className = 'turn-bar ' + turn + '-turn';
  const turnName = turn === X ? matchData.x_name : matchData.o_name;
  txt.textContent = (turn === mySymbol ? '🟢 دورك الآن — ' : 'دور ') + turnName;
  icon.innerHTML = turn === X
    ? `<line x1="15" y1="15" x2="85" y2="85" stroke="#e63757" stroke-width="18" stroke-linecap="round"/>
       <line x1="85" y1="15" x2="15" y2="85" stroke="#e63757" stroke-width="18" stroke-linecap="round"/>`
    : `<circle cx="50" cy="50" r="35" stroke="#00c2e0" stroke-width="18"/>`;
}

function toArabicNum(n) {
  return n.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// نهاية الجولة
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showResultScreen() {
  document.getElementById('rsN1').textContent = matchData.x_name;
  document.getElementById('rsN2').textContent = matchData.o_name;

  const resIcon  = document.getElementById('resIcon');
  const resTitle = document.getElementById('resTitle');
  const resName  = document.getElementById('resName');
  const winner   = matchData.last_winner;

  if (winner) {
    const isX = winner === X;
    resIcon.innerHTML = isX
      ? `<line x1="15" y1="15" x2="85" y2="85" stroke="#e63757" stroke-width="14" stroke-linecap="round"/>
         <line x1="85" y1="15" x2="15" y2="85" stroke="#e63757" stroke-width="14" stroke-linecap="round"/>`
      : `<circle cx="50" cy="50" r="33" stroke="#00c2e0" stroke-width="14"/>`;
    resTitle.textContent = 'فاز!';
    resTitle.className = 'res-title ' + (isX ? 'x' : 'o') + '-win';
    resName.textContent = isX ? matchData.x_name : matchData.o_name;
    launchConfetti(isX ? '#e63757' : '#00c2e0');
  } else {
    resIcon.innerHTML = SVG_DRAW.replace(/<svg[^>]*>|<\/svg>/g,'');
    resTitle.textContent = 'تعادل!';
    resTitle.className = 'res-title draw';
    resName.textContent = 'لا فائز هذه الجولة';
  }

  document.getElementById('rsS1').textContent = matchData.scores_x;
  document.getElementById('rsS2').textContent = matchData.scores_o;

  show('screenResult');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// أزرار
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function rematch() {
  if (!matchData || matchData.active) return;
  const payload = {
    board: Array(9).fill(EMPTY_CELL),
    turn: X,
    round: matchData.round + 1,
    active: true,
    last_winner: '',
    // تبديل الرمزين بين اللاعبين لتحقيق العدالة بمن يبدأ، مع نقل نقاط كل شخص معه
    x_id: matchData.o_id, x_name: matchData.o_name, scores_x: matchData.scores_o,
    o_id: matchData.x_id, o_name: matchData.x_name, scores_o: matchData.scores_x,
  };
  try { await updateDoc(matchRef, payload); }
  catch (e) { if (tg) tg.showAlert('تعذر بدء الإعادة'); }
}

async function resign() {
  if (!matchData || !matchData.active || !mySymbol) return;
  const winnerSym = mySymbol === X ? O : X;
  try { await updateDoc(matchRef, { active: false, last_winner: winnerSym }); }
  catch (e) { if (tg) tg.showAlert('تعذر إرسال الاستسلام'); }
}

function showScore() {
  if (!matchData) return;
  const p1 = matchData.x_name, p2 = matchData.o_name;
  const s1 = matchData.scores_x, s2 = matchData.scores_o;
  if (tg) tg.showAlert(`📊 النتيجة\n\n❌ ${p1}: ${s1}\n⭕ ${p2}: ${s2}`);
  else alert(`📊 ${p1}: ${s1} — ${p2}: ${s2}`);
}

function closeApp() {
  if (tg) tg.close();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// كونفيتي
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function launchConfetti(mainColor) {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = [mainColor, '#f5c542', '#ffffff', '#ff8c00', '#a855f7'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('div');
    p.className = 'cp';
    const size = 5 + Math.random()*8;
    p.style.cssText = `
      left:${Math.random()*100}%;top:-12px;
      width:${size}px;height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-delay:${Math.random()*0.9}s;
      animation-duration:${1.4+Math.random()*1.2}s;
    `;
    wrap.appendChild(p);
  }
  setTimeout(() => wrap.innerHTML='', 3500);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// تصدير الدوال المستخدمة من سمات onclick داخل HTML
// (لازمة لأن type="module" لا يجعلها عامة تلقائياً)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
window.resign    = resign;
window.showScore = showScore;
window.rematch   = rematch;
window.closeApp  = closeApp;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// تشغيل
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
init();
</script>
